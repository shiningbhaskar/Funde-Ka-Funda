<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Sunday Studio — Funde Ka Funda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FAF8F3;
    --card:#FFFFFF;
    --teal:#0E5C4C;
    --teal-deep:#0A4438;
    --gold:#C9971A;
    --gold-soft:#F2E4BC;
    --ink:#1F2A28;
    --ink-soft:#5B6663;
    --line:rgba(14,92,76,0.14);
    --danger:#B3432E;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:'Inter', sans-serif;
    min-height:100vh;
  }
  .app{max-width:520px; margin:0 auto; min-height:100vh; background:var(--paper); border-left:1px solid var(--line); border-right:1px solid var(--line);}
  header{
    padding:22px 20px 16px; background:var(--teal); color:#fff;
    border-bottom:4px solid var(--gold);
  }
  .brand{
    font-family:'Sora', sans-serif; font-weight:800; font-size:20px; letter-spacing:0.2px;
  }
  .brand span{color:var(--gold);}
  .tagline{font-size:12px; opacity:0.85; margin-top:2px;}
  .streak-row{
    display:flex; align-items:center; gap:8px; margin-top:14px;
    font-family:'IBM Plex Mono', monospace; font-size:12px;
  }
  .streak-badge{
    background:var(--gold); color:var(--teal-deep); font-weight:700;
    padding:4px 10px; border-radius:20px; font-size:12px;
  }
  main{padding:20px 18px 50px;}
  .section-title{
    font-family:'Sora', sans-serif; font-weight:700; font-size:15px;
    text-transform:uppercase; letter-spacing:0.8px; color:var(--teal-deep);
    margin:26px 0 10px;
  }
  .section-title:first-child{margin-top:0;}
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:10px;
    padding:16px; box-shadow:0 1px 0 rgba(14,92,76,0.05);
  }
  label{
    display:block; font-family:'IBM Plex Mono', monospace; font-size:11px;
    letter-spacing:1px; text-transform:uppercase; color:var(--ink-soft); margin:14px 0 6px;
  }
  label:first-child{margin-top:0;}
  input[type=text], textarea, select{
    width:100%; padding:11px 12px; border:1.5px solid var(--line); border-radius:8px;
    font-size:15px; font-family:'Inter', sans-serif; background:var(--paper); color:var(--ink);
  }
  textarea{resize:vertical; min-height:64px;}
  input:focus, textarea:focus, select:focus{outline:none; border-color:var(--teal);}
  .len-options{display:flex; gap:8px;}
  .len-opt{
    flex:1; padding:10px 6px; text-align:center; border:1.5px solid var(--line); border-radius:8px;
    font-size:12.5px; cursor:pointer; font-weight:600; color:var(--ink-soft);
  }
  .len-opt.active{background:var(--teal); border-color:var(--teal); color:#fff;}
  .btn{
    width:100%; padding:14px; border:none; border-radius:8px; font-family:'Sora', sans-serif;
    font-weight:700; font-size:14px; letter-spacing:0.3px; cursor:pointer; margin-top:16px;
  }
  .btn-primary{background:var(--teal); color:#fff;}
  .btn-primary:disabled{opacity:0.5;}
  .btn-gold{background:var(--gold); color:var(--teal-deep);}
  .btn-ghost{background:transparent; color:var(--teal); border:1.5px solid var(--teal);}
  .btn-small{width:auto; padding:8px 14px; font-size:12px; margin-top:0;}
  .error{color:var(--danger); font-size:13px; margin-top:8px;}
  .loading-box{text-align:center; padding:30px 10px;}
  .loading-box .dots::after{content:'...'; animation:dots 1.2s steps(4,end) infinite;}
  @keyframes dots{0%,20%{content:'.';}40%{content:'..';}60%,100%{content:'...';}}
  .tabs{display:flex; gap:6px; overflow-x:auto; margin-bottom:12px; padding-bottom:2px;}
  .tab{
    font-family:'IBM Plex Mono', monospace; font-size:11px; letter-spacing:0.5px; text-transform:uppercase;
    padding:8px 12px; border-radius:20px; border:1.5px solid var(--line); white-space:nowrap; cursor:pointer;
    color:var(--ink-soft); flex-shrink:0;
  }
  .tab.active{background:var(--teal-deep); border-color:var(--teal-deep); color:#fff;}
  .scene{
    border-left:3px solid var(--gold); padding:8px 0 8px 12px; margin-bottom:12px;
  }
  .scene-head{
    font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--ink-soft); margin-bottom:4px;
  }
  .scene-script{font-size:15px; line-height:1.55;}
  .visual-note{font-size:12.5px; color:var(--ink-soft); font-style:italic; margin-top:4px;}
  .slide-block{
    background:var(--gold-soft); border-radius:8px; padding:12px 14px; margin-bottom:10px;
  }
  .slide-num{font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--teal-deep); font-weight:600;}
  .slide-title{font-family:'Sora', sans-serif; font-weight:700; font-size:15px; margin:2px 0 6px;}
  .slide-block ul{margin:0; padding-left:18px; font-size:13.5px; line-height:1.5;}
  .thumb-card{border:1.5px dashed var(--line); border-radius:8px; padding:12px; margin-bottom:10px;}
  .thumb-overlay{font-family:'Sora', sans-serif; font-weight:800; font-size:16px; color:var(--teal-deep); margin:4px 0;}
  .thumb-desc{font-size:13px; color:var(--ink-soft); line-height:1.5;}
  .title-opt{
    padding:10px 12px; background:var(--card); border:1px solid var(--line); border-radius:8px;
    margin-bottom:8px; font-size:14px; font-weight:600;
  }
  .meta-block{font-size:13.5px; line-height:1.6; white-space:pre-wrap;}
  .copy-btn{
    font-family:'IBM Plex Mono', monospace; font-size:11px; letter-spacing:0.5px; text-transform:uppercase;
    background:none; border:1px solid var(--line); border-radius:6px; padding:5px 10px; cursor:pointer;
    color:var(--ink-soft); float:right;
  }
  .newsletter-body{font-size:14.5px; line-height:1.6; white-space:pre-wrap;}
  .cal-item{
    display:flex; justify-content:space-between; align-items:center; gap:8px;
    padding:12px; background:var(--card); border:1px solid var(--line); border-radius:8px; margin-bottom:8px;
    cursor:pointer;
  }
  .cal-topic{font-weight:600; font-size:14px;}
  .cal-date{font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--ink-soft);}
  .status-pill{
    font-family:'IBM Plex Mono', monospace; font-size:10.5px; padding:3px 9px; border-radius:12px; text-transform:uppercase;
  }
  .status-draft{background:#EAE6DC; color:var(--ink-soft);}
  .status-recorded{background:var(--gold-soft); color:var(--teal-deep);}
  .status-published{background:var(--teal); color:#fff;}
  .empty-hint{font-size:13px; color:var(--ink-soft); text-align:center; padding:20px 10px;}
  footer{padding:20px; text-align:center; font-family:'IBM Plex Mono', monospace; font-size:10px; color:var(--ink-soft); letter-spacing:1px; text-transform:uppercase; border-top:1px solid var(--line);}
</style>

<body>
<div class="app" id="app"></div>
<script>
const app = document.getElementById('app');
let state = { view:'form', length:'standard', pack:null, activeTab:'script', calendar:[], generating:false, error:null, subCount:null };

// PASTE YOUR GOOGLE APPS SCRIPT WEB APP URL AND ADMIN SECRET HERE
// (same values you used when setting up fkf-newsletter-backend.gs)
const BACKEND_URL = "PASTE_YOUR_APPS_SCRIPT_URL_HERE";
const ADMIN_SECRET = "PASTE_YOUR_ADMIN_SECRET_HERE";

function backendReady(){
  return BACKEND_URL && BACKEND_URL.indexOf('script.google.com') !== -1;
}
function newsletterReady(){ return backendReady(); }

async function backendCall(action, params){
  if(!backendReady()) throw new Error('Backend not configured — set BACKEND_URL at the top of this file.');
  const qs = Object.keys(params||{}).map(k=>encodeURIComponent(k)+'='+encodeURIComponent(params[k])).join('&');
  const res = await fetch(`${BACKEND_URL}?action=${action}&secret=${encodeURIComponent(ADMIN_SECRET)}${qs?'&'+qs:''}`);
  const data = await res.json();
  if(data.error) throw new Error(data.error);
  return data;
}

async function fetchSubCount(){
  if(!backendReady()) return;
  try{
    const res = await fetch(`${BACKEND_URL}?action=count`);
    const data = await res.json();
    state.subCount = data.count;
  }catch(e){}
}

async function sendNewsletterNow(subject, body, videoLink){
  return await backendCall('sendNewsletter', { subject, body, videoLink: videoLink||'' });
}

function loadCalendar(){
  try{
    const raw = localStorage.getItem('fkf_calendar');
    state.calendar = raw ? JSON.parse(raw) : [];
  }catch(e){ state.calendar = []; }
}
function saveCalendar(){
  try{ localStorage.setItem('fkf_calendar', JSON.stringify(state.calendar)); }catch(e){}
}

function daysAgo(ts){
  const diff = Math.floor((Date.now()-ts)/86400000);
  if(diff===0) return 'Today';
  if(diff===1) return 'Yesterday';
  return diff+' days ago';
}

function computeStreak(){
  if(!state.calendar.length) return 0;
  const sorted = [...state.calendar].sort((a,b)=>b.createdAt-a.createdAt);
  let streak=0, cursor = new Date(); cursor.setHours(0,0,0,0);
  const weekMs = 7*86400000;
  for(let i=0;i<sorted.length;i++){
    const epWeekStart = new Date(sorted[i].createdAt); epWeekStart.setHours(0,0,0,0);
    const diffWeeks = Math.floor((cursor - epWeekStart)/weekMs);
    if(diffWeeks===streak){ streak++; }
    else if(diffWeeks>streak){ break; }
  }
  return streak;
}

async function findTrendingTopics(){
  const data = await backendCall('trendingTopics', {});
  return data.suggestions || [];
}

async function generatePack(topic, stats, length){
  return await backendCall('generatePack', { topic, stats, length });
}

function render(){
  app.innerHTML = '';
  const header = document.createElement('header');
  const streak = computeStreak();
  header.innerHTML = `
    <div class="brand">Sunday <span>Studio</span></div>
    <div class="tagline">Funde Ka Funda — one topic in, one week's content out</div>
    <div class="streak-row">
      <span class="streak-badge">${streak} week${streak===1?'':'s'} streak</span>
      <span>${state.calendar.length} episode${state.calendar.length===1?'':'s'} logged</span>
      ${state.subCount!==null ? `<span>· ${state.subCount} subscriber${state.subCount===1?'':'s'}</span>` : ''}
    </div>
  `;
  app.appendChild(header);
  if(state.subCount===null) fetchSubCount().then(()=>{ if(state.subCount!==null){ const el=app.querySelector('.streak-row'); if(el) el.innerHTML += `<span>· ${state.subCount} subscriber${state.subCount===1?'':'s'}</span>`; } });

  const main = document.createElement('main');
  app.appendChild(main);

  if(state.view==='form') renderForm(main);
  else if(state.view==='result') renderResult(main);
  else if(state.view==='detail') renderDetail(main);

  renderCalendarSection(main);

  const footer = document.createElement('footer');
  footer.textContent = 'Give it a topic. It gives you the week.';
  app.appendChild(footer);
}

function renderForm(main){
  const wrap = document.createElement('div');
  wrap.innerHTML = `
    <div class="section-title">Trending Right Now</div>
    <div class="card">
      <p style="margin:0 0 10px; font-size:13px; color:var(--ink-soft); line-height:1.5;">Runs a live web search across current finance YouTube/blog coverage right now — not a background monitor, just fresh results on demand.</p>
      <button class="btn btn-ghost" id="trendBtn" ${state.trendLoading?'disabled':''}>${state.trendLoading ? 'Searching…' : 'Find Trending Topics'}</button>
      <div id="trendResults"></div>
    </div>
    <div class="section-title">New Episode</div>
    <div class="card">
      <label>Topic</label>
      <input type="text" id="topicInput" placeholder="e.g. Step-up SIP vs regular SIP" value="${state.draftTopic||''}">
      <label>Stats / data to include (optional)</label>
      <textarea id="statsInput" placeholder="Paste any numbers, AMFI data, or specifics you want used">${state.draftStats||''}</textarea>
      <label>Video Length</label>
      <div class="len-options">
        <div class="len-opt ${state.length==='short'?'active':''}" data-len="short">Short<br>3-4 min</div>
        <div class="len-opt ${state.length==='standard'?'active':''}" data-len="standard">Standard<br>5-7 min</div>
        <div class="len-opt ${state.length==='deep'?'active':''}" data-len="deep">Deep Dive<br>8-12 min</div>
      </div>
      ${state.error ? `<div class="error">${state.error}</div>` : ''}
      <button class="btn btn-primary" id="genBtn" ${state.generating?'disabled':''}>${state.generating ? 'Producing your episode…' : 'Generate Episode Pack'}</button>
    </div>
  `;
  main.appendChild(wrap);

  if(state.trendSuggestions){
    renderTrendResults(wrap.querySelector('#trendResults'));
  }

  wrap.querySelector('#trendBtn').onclick = async ()=>{
    state.trendLoading = true;
    state.trendError = null;
    render();
    try{
      state.trendSuggestions = await findTrendingTopics();
    }catch(e){
      state.trendSuggestions = null;
      state.trendError = 'Search failed: ' + (e && e.message ? e.message : String(e));
    }
    state.trendLoading = false;
    render();
  };

  wrap.querySelectorAll('.len-opt').forEach(el=>{
    el.onclick = ()=>{ state.length = el.dataset.len; render(); };
  });
  wrap.querySelector('#topicInput').oninput = e=>{ state.draftTopic = e.target.value; };
  wrap.querySelector('#statsInput').oninput = e=>{ state.draftStats = e.target.value; };

  wrap.querySelector('#genBtn').onclick = async ()=>{
    const topic = wrap.querySelector('#topicInput').value.trim();
    if(!topic){ state.error = 'Give it a topic to work with.'; render(); return; }
    state.generating = true; state.error = null; render();
    try{
      const pack = await generatePack(topic, wrap.querySelector('#statsInput').value.trim(), state.length);
      state.pack = pack;
      state.pack._topic = topic;
      state.pack._length = state.length;
      state.generating = false;
      state.activeTab = 'script';
      state.view = 'result';
      render();
    }catch(e){
      state.generating = false;
      state.error = 'Generation failed: ' + (e && e.message ? e.message : String(e));
      render();
    }
  };
}

function renderTrendResults(container){
  if(state.trendError){
    container.innerHTML = `<div class="error">${state.trendError}</div>`;
    return;
  }
  if(!state.trendSuggestions || !state.trendSuggestions.length) return;
  container.innerHTML = state.trendSuggestions.map((s,i)=>`
    <div class="thumb-card" style="margin-top:10px;">
      <div class="scene-head">${s.why_trending}${s.search_interest ? ` · 📈 ${s.search_interest}` : ''}</div>
      <div class="slide-title" style="margin:4px 0;">${s.topic}</div>
      <div class="thumb-desc" style="margin-bottom:8px;">Hook: "${s.suggested_hook}"</div>
      <button class="btn btn-gold btn-small" data-i="${i}">Use This Topic</button>
    </div>
  `).join('');
  container.querySelectorAll('button[data-i]').forEach(btn=>{
    btn.onclick = ()=>{
      const s = state.trendSuggestions[btn.dataset.i];
      state.draftTopic = s.topic;
      state.draftStats = s.suggested_hook;
      render();
    };
  });
}

function packTabText(p, tab){
  if(tab==='script'){
    return `🎬 ${p.hook}\n\n` + p.script_scenes.map(s=>`SCENE ${s.scene_number} (~${s.duration_hint_sec}s)\n${s.script_hinglish}\n[${s.visual_note}]`).join('\n\n');
  }
  if(tab==='slides'){
    return p.slide_outline.map(s=>`SLIDE ${s.slide_number}: ${s.title}\n${s.bullets.map(b=>'- '+b).join('\n')}`).join('\n\n');
  }
  if(tab==='thumb'){
    return p.thumbnail_concepts.map(t=>`${t.concept.toUpperCase()}\nText overlay: "${t.text_overlay}"\n${t.visual_description}`).join('\n\n');
  }
  if(tab==='yt'){
    return `TITLE OPTIONS\n${p.youtube.title_options.map(t=>'- '+t).join('\n')}\n\nDESCRIPTION\n${p.youtube.description}\n\nTAGS\n${p.youtube.tags.join(', ')}`;
  }
  if(tab==='news'){
    return `SUBJECT: ${p.newsletter_issue.subject_line}\n\n${p.newsletter_issue.body_hinglish}`;
  }
  return '';
}

function renderResult(main){
  const p = state.pack;
  const wrap = document.createElement('div');
  wrap.innerHTML = `<div class="section-title">Episode Pack — ${p._topic}</div>`;
  const tabsBar = document.createElement('div');
  tabsBar.className = 'tabs';
  const tabs = [
    ['script','Hook & Script'], ['slides','Slide Outline'], ['thumb','Thumbnails'],
    ['yt','Title & Desc'], ['news','Newsletter']
  ];
  tabs.forEach(([key,label])=>{
    const t = document.createElement('div');
    t.className = 'tab' + (state.activeTab===key?' active':'');
    t.textContent = label;
    t.onclick = ()=>{ state.activeTab=key; render(); };
    tabsBar.appendChild(t);
  });
  wrap.appendChild(tabsBar);

  const copyRow = document.createElement('div');
  copyRow.style.textAlign = 'right';
  copyRow.style.marginBottom = '6px';
  copyRow.innerHTML = `<button class="copy-btn" id="copyTabBtn" style="float:none;">Copy this tab</button>`;
  wrap.appendChild(copyRow);
  copyRow.querySelector('#copyTabBtn').onclick = (e)=>{
    navigator.clipboard.writeText(packTabText(p, state.activeTab)).then(()=>{
      e.target.textContent = 'Copied!';
      setTimeout(()=>{ e.target.textContent = 'Copy this tab'; }, 1500);
    });
  };

  const card = document.createElement('div');
  card.className = 'card';

  if(state.activeTab==='script'){
    card.innerHTML = `<div style="font-family:'Sora',sans-serif; font-weight:700; font-size:16px; color:var(--teal-deep); margin-bottom:10px;">🎬 ${p.hook}</div>` +
      p.script_scenes.map(s=>`
        <div class="scene">
          <div class="scene-head">SCENE ${s.scene_number} · ~${s.duration_hint_sec}s</div>
          <div class="scene-script">${s.script_hinglish}</div>
          <div class="visual-note">${s.visual_note}</div>
        </div>
      `).join('');
  } else if(state.activeTab==='slides'){
    card.innerHTML = p.slide_outline.map(s=>`
      <div class="slide-block">
        <div class="slide-num">SLIDE ${s.slide_number}</div>
        <div class="slide-title">${s.title}</div>
        <ul>${s.bullets.map(b=>`<li>${b}</li>`).join('')}</ul>
      </div>
    `).join('');
  } else if(state.activeTab==='thumb'){
    card.innerHTML = p.thumbnail_concepts.map(t=>`
      <div class="thumb-card">
        <div class="scene-head">${t.concept.toUpperCase()}</div>
        <div class="thumb-overlay">"${t.text_overlay}"</div>
        <div class="thumb-desc">${t.visual_description}</div>
      </div>
    `).join('');
  } else if(state.activeTab==='yt'){
    card.innerHTML = `
      <label style="margin-top:0;">Title Options</label>
      ${p.youtube.title_options.map(t=>`<div class="title-opt">${t}</div>`).join('')}
      <label>Description</label>
      <div class="meta-block">${p.youtube.description}</div>
      <label>Tags</label>
      <div class="meta-block">${p.youtube.tags.join(', ')}</div>
    `;
  } else if(state.activeTab==='news'){
    card.innerHTML = `
      <label style="margin-top:0;">Subject Line</label>
      <div class="title-opt">${p.newsletter_issue.subject_line}</div>
      <label>Issue Body</label>
      <div class="newsletter-body">${p.newsletter_issue.body_hinglish}</div>
    `;
  }
  wrap.appendChild(card);

  const actions = document.createElement('div');
  actions.style.display='flex'; actions.style.gap='10px'; actions.style.marginTop='14px';
  actions.innerHTML = `
    <button class="btn btn-gold" id="saveBtn" style="flex:1;">Save to Calendar</button>
    <button class="btn btn-ghost" id="newBtn" style="flex:1;">New Topic</button>
  `;
  wrap.appendChild(actions);
  main.appendChild(wrap);

  actions.querySelector('#saveBtn').onclick = async ()=>{
    state.calendar.unshift({
      id: 'ep_'+Date.now(),
      topic: p._topic,
      length: p._length,
      status: 'draft',
      createdAt: Date.now(),
      pack: p
    });
    await saveCalendar();
    state.view = 'form';
    state.pack = null;
    state.draftTopic = '';
    state.draftStats = '';
    render();
  };
  actions.querySelector('#newBtn').onclick = ()=>{
    state.view = 'form';
    state.pack = null;
    render();
  };
}

function renderDetail(main){
  const ep = state.calendar.find(e=>e.id===state.detailId);
  if(!ep){ state.view='form'; render(); return; }
  state.pack = ep.pack;
  state.pack._topic = ep.topic;
  state.pack._length = ep.length;
  const wrap = document.createElement('div');
  wrap.innerHTML = `<button class="btn btn-ghost btn-small" id="backBtn">&larr; Back to Calendar</button>`;
  main.appendChild(wrap);
  wrap.querySelector('#backBtn').onclick = ()=>{ state.view='form'; render(); };
  renderResultInline(main, ep);
}

function renderResultInline(main, ep){
  const holder = document.createElement('div');
  main.appendChild(holder);
  renderResult(holder);
  const actions = holder.querySelector('div[style*="display:flex"]');
  if(actions){
    actions.innerHTML = `
      <select id="statusSel" style="flex:1;">
        <option value="draft" ${ep.status==='draft'?'selected':''}>Draft</option>
        <option value="recorded" ${ep.status==='recorded'?'selected':''}>Recorded</option>
        <option value="published" ${ep.status==='published'?'selected':''}>Published</option>
      </select>
      <button class="btn btn-ghost" id="delBtn" style="flex:1;">Delete Episode</button>
    `;
    actions.querySelector('#statusSel').onchange = async (e)=>{
      const newStatus = e.target.value;
      if(newStatus === 'published' && ep.status !== 'published'){
        const link = prompt("Paste the YouTube video link (this goes in the newsletter and WhatsApp message):");
        if(!link){ e.target.value = ep.status; return; }
        ep.videoLink = link.trim();
        ep.status = 'published';
        ep.whatsappMessage = buildWhatsappMessage(ep);
        await saveCalendar();
        render();
        if(newsletterReady()){
          holder.insertAdjacentHTML('beforeend', `<div class="card" id="sendingNotice" style="margin-top:12px;">Sending newsletter to subscribers…</div>`);
          try{
            const result = await sendNewsletterNow(
              ep.pack.newsletter_issue.subject_line,
              ep.pack.newsletter_issue.body_hinglish,
              ep.videoLink
            );
            ep.newsletterSent = true;
            ep.newsletterSentCount = result.sent || 0;
            await saveCalendar();
          }catch(err){
            ep.newsletterSent = false;
          }
          render();
        }
      } else {
        ep.status = newStatus;
        await saveCalendar();
        render();
      }
    };
    actions.querySelector('#delBtn').onclick = async ()=>{
      state.calendar = state.calendar.filter(x=>x.id!==ep.id);
      await saveCalendar();
      state.view='form';
      render();
    };
  }

  if(ep.status === 'published'){
    const pubCard = document.createElement('div');
    pubCard.className = 'card';
    pubCard.style.marginTop = '12px';
    pubCard.style.borderColor = 'var(--gold)';
    pubCard.innerHTML = `
      <label style="margin-top:0;">Published</label>
      <div class="meta-block">${ep.videoLink || '(no link saved)'}</div>
      <label>Newsletter</label>
      <div class="meta-block">${
        !newsletterReady() ? 'Backend not configured — newsletter not sent automatically.'
        : ep.newsletterSent ? `Sent to ${ep.newsletterSentCount} subscriber${ep.newsletterSentCount===1?'':'s'}.`
        : 'Not sent yet — reopen this episode to retry.'
      }</div>
      <label>WhatsApp Message <button class="copy-btn" id="copyWaBtn">Copy</button></label>
      <div class="meta-block" id="waMsg">${ep.whatsappMessage || buildWhatsappMessage(ep)}</div>
    `;
    holder.appendChild(pubCard);
    const copyBtn = pubCard.querySelector('#copyWaBtn');
    copyBtn.onclick = ()=>{
      navigator.clipboard.writeText(pubCard.querySelector('#waMsg').textContent).then(()=>{
        copyBtn.textContent = 'Copied!';
        setTimeout(()=>{ copyBtn.textContent = 'Copy'; }, 1500);
      });
    };
  }
}

function buildWhatsappMessage(ep){
  const hook = ep.pack && ep.pack.hook ? ep.pack.hook : ep.topic;
  const link = ep.videoLink || '[video link]';
  return `🎬 Naya video aa gaya — ${ep.topic}!\n\n${hook}\n\nDekho yahan: ${link}\n\n— Funde Ka Funda`;
}

function renderCalendarSection(main){
  const wrap = document.createElement('div');
  wrap.innerHTML = `
    <div class="section-title" style="display:flex; align-items:center; justify-content:space-between; gap:8px;">
      <span>Content Calendar</span>
      <span>
        <button class="copy-btn" id="exportBtn" style="float:none;">Export</button>
        <button class="copy-btn" id="importBtn" style="float:none;">Import</button>
      </span>
    </div>
    <input type="file" id="importFile" accept="application/json" style="display:none;">
  `;
  if(state.calendar.length > 3){
    const search = document.createElement('input');
    search.type = 'text';
    search.placeholder = 'Search episodes…';
    search.style.marginBottom = '10px';
    search.value = state.calendarFilter || '';
    search.oninput = (e)=>{ state.calendarFilter = e.target.value; render(); };
    wrap.appendChild(search);
  }
  const q = (state.calendarFilter||'').toLowerCase();
  const filtered = q ? state.calendar.filter(ep=>ep.topic.toLowerCase().includes(q)) : state.calendar;
  if(!state.calendar.length){
    wrap.innerHTML += `<div class="empty-hint">No episodes yet — generate your first one above and save it here.</div>`;
  } else if(!filtered.length){
    wrap.innerHTML += `<div class="empty-hint">No episodes match "${state.calendarFilter}".</div>`;
  } else {
    filtered.forEach(ep=>{
      const item = document.createElement('div');
      item.className = 'cal-item';
      item.innerHTML = `
        <div>
          <div class="cal-topic">${ep.topic}</div>
          <div class="cal-date">${daysAgo(ep.createdAt)} · ${ep.length}</div>
        </div>
        <span class="status-pill status-${ep.status}">${ep.status}</span>
      `;
      item.onclick = ()=>{ state.view='detail'; state.detailId=ep.id; state.activeTab='script'; render(); };
      wrap.appendChild(item);
    });
  }
  main.appendChild(wrap);

  wrap.querySelector('#exportBtn').onclick = ()=>{
    const blob = new Blob([JSON.stringify(state.calendar, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `sunday-studio-backup-${new Date().toISOString().slice(0,10)}.json`;
    a.click();
    URL.revokeObjectURL(url);
  };
  wrap.querySelector('#importBtn').onclick = ()=> wrap.querySelector('#importFile').click();
  wrap.querySelector('#importFile').onchange = async (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    try{
      const text = await file.text();
      const imported = JSON.parse(text);
      if(!Array.isArray(imported)) throw new Error('File is not a valid backup.');
      const existingIds = new Set(state.calendar.map(ep=>ep.id));
      const merged = imported.filter(ep=>!existingIds.has(ep.id));
      state.calendar = [...merged, ...state.calendar];
      await saveCalendar();
      render();
    }catch(err){
      alert('Import failed: ' + (err && err.message ? err.message : String(err)));
    }
  };
}

(async function init(){
  await loadCalendar();
  render();
})();
</script>
